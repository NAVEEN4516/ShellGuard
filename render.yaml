services:
  - type: web
    name: shellguard-live-demo
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn daemon.server:app --host 0.0.0.0 --port $PORT
    plan: free
    region: oregon
    autoDeploy: true
    envVars:
      - key: SHELLGUARD_DISABLE_AUTH
        value: "1"
      - key: SHELLGUARD_FAIL_POLICY
        value: "fail_open"
      - key: PYTHON_VERSION
        value: "3.11.9"
